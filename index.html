<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة التسجيل في الأكاديمية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .form-container {
            max-width: 500px;
            background: #fff;
            margin: 20px auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="number"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus, select:focus {
            border-color: #27ae60;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>استمارة التسجيل في الأكاديمية</h2>
    <form id="registrationForm" onsubmit="sendToWhatsApp(event)">
        
        <div class="form-group">
            <label for="fullName">الاسم الرباعي:</label>
            <input type="text" id="fullName" required placeholder="اكتب اسمك الرباعي هنا">
        </div>

        <div class="form-group">
            <label for="age">العمر:</label>
            <input type="number" id="age" required placeholder="أدخل عمرك الحقيقي">
        </div>

        <div class="form-group">
            <label for="originGovernorate">المحافظة (الأصل):</label>
            <input type="text" id="originGovernorate" required placeholder="المحافظة التي تنتمي إليها">
        </div>

        <div class="form-group">
            <label for="district">المديرية:</label>
            <input type="text" id="district" required placeholder="أدخل اسم المديرية">
        </div>

        <div class="form-group">
            <label for="phone">رقم الهاتف أو الواتساب:</label>
            <input type="tel" id="phone" required placeholder="7xxxxxxxx">
        </div>

        <div class="form-group">
            <label for="birthPlace">مكان الميلاد (لعمل الشهادة):</label>
            <input type="text" id="birthPlace" required placeholder="مثال: المحافظة / المديرية">
        </div>

        <div class="form-group">
            <label for="birthDate">تاريخ الميلاد (لعمل الشهادة):</label>
            <input type="date" id="birthDate" required>
        </div>

        <button type="submit">اضغط للتسجيل وإرسال البيانات</button>
    </form>
</div>

<script>
function sendToWhatsApp(event) {
    event.preventDefault(); // منع الصفحة من إعادة التحميل

    // رقم هاتف مشرف الأكاديمية المعتمد بدون إضافات
    const adminPhoneNumber = "967718722595"; 

    // جلب البيانات من الخانات
    const fullName = document.getElementById('fullName').value;
    const age = document.getElementById('age').value;
    const originGovernorate = document.getElementById('originGovernorate').value;
    const district = document.getElementById('district').value;
    const phone = document.getElementById('phone').value;
    const birthPlace = document.getElementById('birthPlace').value;
    const birthDate = document.getElementById('birthDate').value;

    // تنسيق نص الرسالة المرتبة للمشرف
    const message = `*طلب تسجيل جديد في الأكاديمية* \n\n` +
                    `📝 *الاسم الرباعي:* ${fullName}\n` +
                    `🔢 *العمر:* ${age}\n` +
                    `🌍 *المحافظة (الأصل):* ${originGovernorate}\n` +
                    `📍 *المديرية:* ${district}\n` +
                    `📞 *رقم الهاتف:* ${phone}\n` +
                    `🏛️ *مكان الميلاد:* ${birthPlace}\n` +
                    `📅 *تاريخ الميلاد:* ${birthDate}`;

    // ترميز الرسالة لتناسب الروابط
    const encodedMessage = encodeURIComponent(message);

    // إنشاء رابط الواتساب المصلح والمباشر
    const whatsAppUrl = `https://wa.me{adminPhoneNumber}?text=${encodedMessage}`;

    // فتح الرابط وتوجيه الطالب للواتساب مباشرة
    window.open(whatsAppUrl, '_blank');
}
</script>

</body>
</html>
